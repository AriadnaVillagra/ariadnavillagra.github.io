<svg width="360" height="620" viewBox="0 0 360 620" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="360" height="680" fill="#111827"/>

  <!-- Top bar -->
  <rect width="360" height="36" fill="#F2A7D5"/>
  <text x="12" y="23" font-family="monospace" font-size="13" fill="#1F2937">
    Postman — yes, I actually use this
  </text>

  <!-- Request bar -->
  <rect x="12" y="48" width="336" height="36" fill="#1F2937" stroke="#374151"/>
  <rect x="20" y="56" width="48" height="20" fill="#FAF4B7"/>
  <text x="30" y="71" font-family="monospace" font-size="12" fill="#111827">
    GET
  </text>
  <text x="80" y="71" font-family="monospace" font-size="12" fill="#E5E7EB">
    /experience
  </text>

  <!-- Response box -->
  <rect x="12" y="96" width="336" height="500" fill="#0F172A" stroke="#374151"/>

  <!-- Response content -->
  <text x="20" y="132" font-family="monospace" font-size="13" fill="#E5E7EB">

    <tspan x="20" dy="0">{</tspan>

    <!-- status -->
    <tspan x="36" dy="20" fill="#CDF0EA">"status"</tspan>
    <tspan fill="#E5E7EB">:</tspan>
    <tspan fill="#FAF4B7"> 200</tspan><tspan>,</tspan>

    <!-- petly -->
    <tspan x="36" dy="20" fill="#CDF0EA">"petly"</tspan>
    <tspan fill="#E5E7EB">:</tspan>
    <tspan x="52" dy="20" fill="#FAF4B7">{</tspan>

    <tspan x="68" dy="18" fill="#FAF4B7">"role": "frontend + backend",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"type": "mobile app"</tspan>

    <tspan x="52" dy="18" fill="#FAF4B7">}</tspan><tspan>,</tspan>

    <!-- pharma -->
    <tspan x="36" dy="22" fill="#CDF0EA">"pharma_sales_app"</tspan>
    <tspan fill="#E5E7EB">:</tspan>
    <tspan x="52" dy="20" fill="#FAF4B7">{</tspan>

    <tspan x="68" dy="18" fill="#FAF4B7">"client": "Bagó",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"role": "frontend",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"type": "mobile / web"</tspan>

    <tspan x="52" dy="18" fill="#FAF4B7">}</tspan><tspan>,</tspan>

    <!-- integrations -->
    <tspan x="36" dy="22" fill="#CDF0EA">"integrations"</tspan>
    <tspan fill="#E5E7EB">:</tspan>
    <tspan x="52" dy="20" fill="#FAF4B7">[</tspan>

    <tspan x="68" dy="18" fill="#FAF4B7">"Google Calendar",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"Gmail API",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"AWS services",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"GCP"</tspan>

    <tspan x="52" dy="18" fill="#FAF4B7">]</tspan><tspan>,</tspan>

    <!-- distribution -->
    <tspan x="36" dy="22" fill="#CDF0EA">"distribution"</tspan>
    <tspan fill="#E5E7EB">:</tspan>
    <tspan x="52" dy="20" fill="#FAF4B7">[</tspan>

    <tspan x="68" dy="18" fill="#FAF4B7">"Google Play Console",</tspan>
    <tspan x="68" dy="18" fill="#FAF4B7">"Apple App Store"</tspan>

    <tspan x="52" dy="18" fill="#FAF4B7">]</tspan>

    <tspan x="20" dy="24">}</tspan>

  </text>

  <!-- Status -->
  <text x="260" y="600" font-family="monospace" font-size="12" fill="#10B981">
    200 OK
  </text>

</svg>
