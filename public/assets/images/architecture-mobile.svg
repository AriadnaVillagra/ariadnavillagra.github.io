    app / features
  </text>

  <!-- Window buttons -->
  <rect x="320" y="12" width="10" height="10" fill="#FAF4B7"/>
  <rect x="304" y="12" width="10" height="10" fill="#CDF0EA"/>
  <rect x="288" y="12" width="10" height="10" fill="#F6C6EA"/>

  <!-- Content area -->
  <rect x="12" y="52" width="336" height="420" rx="6" fill="#F9F9F9"/>

  <!-- Presentation -->
  <text x="28" y="90" font-family="monospace" font-size="16" fill="#111827">
