  </text>

  <line x1="28" y1="132" x2="332" y2="132" stroke="#E5E7EB"/>

  <!-- Application -->
  <text x="28" y="168" font-family="monospace" font-size="16" fill="#111827">
    📁 application
  </text>
  <text x="28" y="190" font-family="monospace" font-size="13" fill="#6B7280">
