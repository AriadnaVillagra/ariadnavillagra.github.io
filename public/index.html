<!DOCTYPE html>
<html lang="en">

<head>
	<base href="./">
	<link rel="preconnect" href="https://readme-typing-svg.herokuapp.com">
	<link rel="preload" as="image" href="./assets/images/tech-stack.svg">

	<link rel="icon" href="./favicon-v2.ico">
	<link rel="stylesheet" href="./assets/styles/base.css" />
	<link rel="stylesheet" href="./assets/styles/animations.css" />
	<link rel="stylesheet" href="./assets/styles/theme.css" />

	<meta charset="UTF-8" />
	<title>Ariadna Villagra</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description"
		content="Frontend Engineer — clean architecture, real-world integrations, systems thinking." />

	<meta property="og:title" content="Ariadna Villagra — Frontend Engineer" />
	<meta property="og:description"
		content="Frontend-first by choice. Architecture, integrations and systems that actually run." />
	<meta property="og:image" content="https://ariadnavillagra.github.io/assets/ariadna-villagra-developer.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:url" content="https://ariadnavillagra.github.io" />
</head>


<!-- Built without frameworks on purpose. Focus: performance, clarity, and maintainability.-->

<body>
	<div class="container">
		<button id="theme-toggle" aria-label="Toggle theme">
			🌗
		</button>

		<!-- Typing intro mobile -->
		<img class="mobile-only"
			src="https://readme-typing-svg.herokuapp.com?font=Montserrat&weight=500&size=34&pause=1000&color=F2A7D5&width=360&lines=Frontend+Engineer.;I+turn+requirements;into+software.;Clean+architecture;because+chaos;is+tiring.;Yes%2C+it+scales."
			alt="Typing intro" />

		<!-- Typing intro desktop -->
		<img class="desktop-only"
			src="https://readme-typing-svg.herokuapp.com?font=Montserrat&weight=500&size=26&pause=1000&color=F2A7D5&width=750&lines=Frontend+Engineer.;I+turn+requirements+into+software.;Clean+architecture+because+chaos+is+tiring.;Yes%2C+it+scales."
			alt="Typing intro" />

		<!-- Tech stack -->
		<img class="reveal mobile-only" style="--delay: 0s" src="./assets/images/tech-stack-mobile.svg"
			alt="Tech stack terminal (mobile)" />

		<img class="reveal desktop-only" style="--delay: 0s" src="./assets/images/tech-stack.svg"
			alt="Tech stack terminal" />

		<!-- Architecture -->
		<img class="reveal mobile-only" style="--delay: 0.15s" src="./assets/images/architecture-mobile.svg"
			alt="Architecture overview (mobile)" />

		<img class="reveal desktop-only" style="--delay: 0.15s" src="./assets/images/architecture-v2.svg"
			alt="Architecture overview" />

		<!-- Experience -->
		<img class="reveal mobile-only" style="--delay: 0.3s" src="./assets/images/experience-mobile.svg"
			alt="Experience API response (mobile)" />

		<img class="reveal desktop-only" style="--delay: 0.3s" src="./assets/images/experience-v2.svg"
			alt="Experience API response" />

		<!-- Links + business cat -->
		<div class="links reveal-final">
			<a class="link-item" href="https://www.linkedin.com/in/ariadna-villagra/" target="_blank">
				LinkedIn
			</a>

			<a class="link-item"
				href="https://github.com/AriadnaVillagra/AriadnaVillagra/blob/main/assets/Curr%C3%ADculum%20Ariadna%20Villagra%20%28EN%29.pdf"
				target="_blank">
				CV (PDF)
			</a>

			<img class="business-cat" src="./assets/images/busines-cat.gif" alt="Business cat approves" role="button"
				tabindex="0" title="yes, this is professional" />
			<div id="cat-message" aria-live="polite"></div>
		</div>

	</div>

	<!-- Scripts -->
	<script src="./assets/js/reveal.js" defer></script>
	<script src="./assets/js/theme.js" defer></script>
	<script src="./assets/js/cat.js" defer></script>

</body>

</html>
