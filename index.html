<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ariadna Villagra</title>

  <!-- Meta for LinkedIn / social preview -->
  <meta name="description" content="Frontend Engineer — clean architecture, real-world integrations, systems thinking." />
  <meta property="og:title" content="Ariadna Villagra — Frontend Engineer" />
  <meta property="og:description" content="Frontend-first by choice. Architecture, integrations and systems that actually run." />
  <meta property="og:image" content="https://ariadnavillagra.github.io/assets/kawaii-error-v3.svg" />
  <meta property="og:url" content="https://ariadnavillagra.github.io" />

  <style>
    body {
      margin: 0;
      padding: 56px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    img {
      max-width: 100%;
      margin: 40px 0;
    }

		a {
  		color: #f2a7d5;
  		text-decoration: none;
  		font-weight: 500;
  		position: relative;
  		transition: color 0.25s ease, transform 0.25s ease;
		}

		a::after {
		  content: "";
		  position: absolute;
		  left: 0;
		  bottom: -4px;
		  width: 100%;
		  height: 2px;
		  background: #f2a7d5;
		  transform: scaleX(0);
		  transform-origin: left;
		  transition: transform 0.25s ease;
		}

		a:hover {
		  color: #cdf0ea;
		  transform: translateY(-1px);
		}
		
		a:hover::after {
		  transform: scaleX(1);
		}

    .links {
      margin-top: 48px;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      align-items: center;
    }

		.link-item {
		  color: #f2a7d5;
		  font-weight: 500;
		  position: relative;
		  transition: color 0.25s ease, transform 0.25s ease;
		}

		.link-item::after {
		  content: "";
		  position: absolute;
		  left: 0;
		  bottom: -4px;
		  width: 100%;
		  height: 2px;
		  background: #f2a7d5;
		  transform: scaleX(0);
		  transform-origin: left;
		  transition: transform 0.25s ease;
		}
		
		.link-item:hover {
		  color: #cdf0ea;
		  transform: translateY(-1px);
		}
		
		.link-item:hover::after {
		  transform: scaleX(1);
		}
		
    .links img {
      margin: 0;
      width: 80px;
    }
		.business-cat {
		  width: 80px;
		  transition: transform 0.3s ease, filter 0.3s ease;
		}
		
		@media (hover: hover) and (pointer: fine) {

  /* Link hover (desktop only) */
	  .link-item:hover {
	    color: #cdf0ea;
	    transform: translateY(-1px);
	  }
	
	  .link-item:hover::after {
	    transform: scaleX(1);
	  }
	
	  /* Business cat special hover 😼 */
	  .business-cat:hover {
	    transform: translateY(-6px) rotate(-3deg) scale(1.05);
	    filter: drop-shadow(0 10px 25px rgba(242, 167, 213, 0.45));
	  }
	}
  </style>
</head>

<body>
  <div class="container">

    <!-- Typing intro -->
    <img
      src="https://readme-typing-svg.herokuapp.com?font=Montserrat&weight=500&size=26&pause=1000&color=F2A7D5&width=750&lines=Frontend+Engineer.;I+turn+requirements+into+software.;Clean+architecture+because+chaos+is+tiring.;Yes%2C+it+scales."
      alt="Typing intro"
    />

    <!-- Tech stack -->
    <img
      src="./assets/tech-stack.svg"
      alt="Tech stack terminal"
    />

    <!-- Architecture -->
    <img
      src="./assets/architecture-v2.svg"
      alt="Architecture overview"
    />

    <!-- Experience -->
    <img
      src="./assets/experience.svg"
      alt="Experience"
    />

    <!-- Links + business cat -->
    <div class="links">
      <a class="link-item" href="https://www.linkedin.com/in/ariadna-villagra/" target="_blank">
        LinkedIn
      </a>

      <a
				class="link-item"
        href="https://github.com/AriadnaVillagra/AriadnaVillagra/blob/main/assets/Curr%C3%ADculum%20Ariadna%20Villagra%20%28EN%29.pdf"
        target="_blank"
      >
        CV (PDF)
      </a>

      <img
				class="business-cat"
        src="./assets/busines-cat.gif"
        alt="Business cat approves"
        title="yes, this is professional"
      />
    </div>

  </div>
</body>
</html>
