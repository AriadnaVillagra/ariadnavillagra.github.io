<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ariadna Villagra</title>

  <!-- Meta for LinkedIn / social preview -->
  <meta name="description" content="Frontend Engineer — clean architecture, real-world integrations, systems thinking." />
  <meta property="og:title" content="Ariadna Villagra — Frontend Engineer" />
  <meta property="og:description" content="Frontend-first by choice. Architecture, integrations and systems that actually run." />
  <meta property="og:image" content="https://ariadnavillagra.github.io/assets/kawaii-error-v3.svg" />
  <meta property="og:url" content="https://ariadnavillagra.github.io" />

  <style>		


	    body {
	      margin: 0;
	      padding: 56px 16px;
	      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
	      background: #0f172a;
	      color: #e5e7eb;
	      text-align: center;
	    }
	  		body.light {
		  background: #faf4b7;
		  color: #1f2937;
		}

	    .container {
	      max-width: 900px;
	      margin: 0 auto;
	    }	
	    img {
	      max-width: 100%;
	      margin: 40px 0;
	    }
			a {
		  color: inherit;
		  text-decoration: none;
		}
	  
	  		#theme-toggle {
		  background: none;
		  border: none;
		  color: #9ca3af;
		  font-size: 18px;
		  cursor: pointer;
		  margin-bottom: 24px;
		  transition: transform 0.25s ease, color 0.25s ease;
		}
		
		#theme-toggle:hover {
		  transform: rotate(20deg);
		  color: #f2a7d5;
		}
	  #cat-message {
  width: 100%;
  text-align: center;
}

#cat-message.visible {
  opacity: 1;
}
	  	  	body.light a {
	      color: #db2777;
	   }
	    .links {
	      margin-top: 48px;
	      display: flex;
	      justify-content: center;
	      gap: 32px;
	      flex-wrap: wrap;
	      align-items: center;
	    }
		.link-item {
		  color: #f2a7d5;
		  font-weight: 500;
		  position: relative;
		  transition: color 0.25s ease, transform 0.25s ease;
		}
		.link-item::after {
		  content: "";
		  position: absolute;
		  left: 0;
		  bottom: -4px;
		  width: 100%;
		  height: 2px;
		  background: #f2a7d5;
		  transform: scaleX(0);
		  transform-origin: left;
		  transition: transform 0.25s ease;
		}
		.link-item:hover {
		  color: #cdf0ea;
		  transform: translateY(-1px);
		}	
		.link-item:hover::after {
		  transform: scaleX(1);
		}
	    .links img {
	      margin: 0;
	      width: 80px;
	    }
		.business-cat {
		  width: 80px;
		  transition: transform 0.3s ease, filter 0.3s ease;
		}
		.reveal {
		  opacity: 0;
		  transform: translateY(24px);
		  transition:
		  opacity 0.6s ease,
		  transform 0.6s ease;
		  transition-delay: var(--delay, 0s);
		}
		.reveal.is-visible {
		  opacity: 1;
		  transform: translateY(0);
		}

		.reveal-final {
		  opacity: 0;
		  transform: scale(0.97);
		  transition:
		  opacity 0.8s ease,
		  transform 0.8s ease;
		  transition-delay: 0.45s;
		}
	
		.reveal-final.is-visible {
		  opacity: 1;
		  transform: scale(1);
		}
		
@media (hover: hover) and (pointer: fine) {
	  /* Business cat special hover 😼 */
	  .business-cat:hover {
	    transform: translateY(-6px) rotate(-3deg) scale(1.05);
	    filter: drop-shadow(0 10px 25px rgba(242, 167, 213, 0.45));
	  }
	}
	  /* Accessibility: no motion if user asks for it */
@media (prefers-reduced-motion: reduce) {
	  .reveal {
	    opacity: 1;
	    transform: none;
	    transition: none;
	  }
}
  </style>
</head>


	
<body>
  <div class="container">
	<button id="theme-toggle" aria-label="Toggle theme">
	  🌗
	</button>

    <!-- Typing intro -->
    <img
      src="https://readme-typing-svg.herokuapp.com?font=Montserrat&weight=500&size=26&pause=1000&color=F2A7D5&width=750&lines=Frontend+Engineer.;I+turn+requirements+into+software.;Clean+architecture+because+chaos+is+tiring.;Yes%2C+it+scales."
      alt="Typing intro"
    />

    <!-- Tech stack -->
    <img
	  class="reveal"
	  style="--delay: 0s"
      src="./assets/tech-stack.svg"
      alt="Tech stack terminal"
    />

    <!-- Architecture -->
    <img
	  class="reveal"
	  style="--delay: 0.15s"
      src="./assets/architecture-v2.svg"
      alt="Architecture overview"
    />

    <!-- Experience -->
    <img
	  class="reveal"
	  style="--delay: 0.3s"
      src="./assets/experience.svg"
      alt="Experience"
    />

    <!-- Links + business cat -->
    <div class="links reveal-final">
      <a class="link-item" href="https://www.linkedin.com/in/ariadna-villagra/" target="_blank">
        LinkedIn
      </a>

      <a
		class="link-item"
        href="https://github.com/AriadnaVillagra/AriadnaVillagra/blob/main/assets/Curr%C3%ADculum%20Ariadna%20Villagra%20%28EN%29.pdf"
        target="_blank"
      >
        CV (PDF)
      </a>

      <img
		class="business-cat"
        src="./assets/busines-cat.gif"
        alt="Business cat approves"
		role="button"
  		tabindex="0"
        title="yes, this is professional"
      />
	<div id="cat-message" aria-hidden="true"></div>
    </div>

  </div>
	  <!-- Scripts -->
 <script>
  /* Reveal animations */
  const reveals = document.querySelectorAll('.reveal, .reveal-final');

  const observer = new IntersectionObserver(
    entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.15 }
  );

  reveals.forEach(el => observer.observe(el));

  /* Theme toggle (yes, it persists) */
  const toggle = document.getElementById('theme-toggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'light') {
    document.body.classList.add('light');
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  }

  /* Business cat easter egg */
  const cat = document.querySelector('.business-cat');
  const catMessage = document.getElementById('cat-message');

  const messages = [
    'I want this job.',
    'Yes. Hire me.',
    'I can do this.',
    'This is fine. Pay me.',
    'Looks good enough to ship.',
    'I’ve done harder things.',
    'We can improve it later.'
  ];

  let clicks = 0;

  if (cat && catMessage) {
    const showMessage = () => {
      const message = messages[clicks % messages.length];
      catMessage.classList.remove('visible');

      setTimeout(() => {
        catMessage.textContent = message;
        catMessage.classList.add('visible');
      }, 100);

      clicks++;
    };

    cat.addEventListener('click', showMessage);

    cat.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') showMessage();
    });
  }
</script>

</body>
</html>
